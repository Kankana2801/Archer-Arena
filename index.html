<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Archer Arena</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>ARCHER ARENA</h1>
	<div class="game-info">

    <div>
        <span>Player 1</span>
        <b id="score1">0</b>

        <div class="health-container">
            <div id="health1" class="health-bar"></div>
        </div>
    </div>

    <div>
        <span>Player 2</span>
        <b id="score2">0</b>

        <div class="health-container">
            <div id="health2" class="health-bar"></div>
        </div>
    </div>

</div>

<h2 id="gameMessage"></h2>
	<canvas id="gameCanvas" width="900" height="450"></canvas>
	<p class ="instructions">
	Click and drag to aim. Release to shoot!</p>
	<button id="restartBtn">Restart Game</button>
	<script src="script.js"></script>
</body>
</html>
